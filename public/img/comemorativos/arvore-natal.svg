<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 200" width="192" height="200" role="img" aria-label="Árvore de Natal com pisca-pisca">
  <!-- Exemplo de avatar comemorativo: árvore de Natal com pisca-pisca (animação em CSS, sem scripts) -->
  <style>
    .luz { animation: pisca 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .estrela { animation: brilha 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .halo { animation: halo 2.4s ease-in-out infinite; }
    .arvore { animation: balanca 6s ease-in-out infinite; transform-origin: 96px 186px; }
    .neve { animation: cai 5s linear infinite; }
    @keyframes pisca { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .25; transform: scale(.75); } }
    @keyframes brilha { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.15) rotate(8deg); } }
    @keyframes halo { 0%, 100% { opacity: .35; } 50% { opacity: .75; } }
    @keyframes balanca { 0%, 100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }
    @keyframes cai { from { transform: translateY(-20px); opacity: 0; } 15% { opacity: .9; } to { transform: translateY(200px); opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="verde" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F9E44"/>
      <stop offset="1" stop-color="#1B5E20"/>
    </linearGradient>
    <radialGradient id="brilho">
      <stop offset="0" stop-color="#FFF3BF"/>
      <stop offset="1" stop-color="#FFF3BF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g fill="#FFFFFF">
    <circle class="neve" cx="20" cy="0" r="2.2" style="animation-delay:0s"/>
    <circle class="neve" cx="170" cy="0" r="2.6" style="animation-delay:1.4s"/>
    <circle class="neve" cx="40" cy="0" r="1.8" style="animation-delay:2.7s"/>
    <circle class="neve" cx="156" cy="0" r="2" style="animation-delay:3.6s"/>
  </g>
  <ellipse cx="96" cy="188" rx="62" ry="7" fill="#06172B" opacity=".15"/>
  <g class="arvore">
    <rect x="84" y="160" width="24" height="26" rx="4" fill="#8D5524"/>
    <path d="M96 36 L150 112 L42 112 Z" fill="url(#verde)"/>
    <path d="M96 66 L166 146 L26 146 Z" fill="url(#verde)"/>
    <path d="M96 98 L178 172 L14 172 Z" fill="url(#verde)"/>
    <g fill="none" stroke="#F1F3F5" stroke-width="2" stroke-linecap="round" opacity=".85">
      <path d="M62 86 Q96 104 130 86"/>
      <path d="M48 122 Q96 142 144 122"/>
      <path d="M34 156 Q96 178 158 156"/>
    </g>
    <g>
    <circle class="luz" cx="68.8" cy="89.2" r="4.2" fill="#FFD43B" style="animation-delay:0.0s"/>
    <circle class="luz" cx="87.2" cy="94.4" r="4.2" fill="#FF4D6D" style="animation-delay:0.37s"/>
    <circle class="luz" cx="104.8" cy="94.4" r="4.2" fill="#4DABF7" style="animation-delay:0.74s"/>
    <circle class="luz" cx="123.2" cy="89.2" r="4.2" fill="#69DB7C" style="animation-delay:1.11s"/>
    <circle class="luz" cx="53.8" cy="124.3" r="4.2" fill="#FFA94D" style="animation-delay:1.48s"/>
    <circle class="luz" cx="73.9" cy="129.9" r="4.2" fill="#FFD43B" style="animation-delay:0.25s"/>
    <circle class="luz" cx="96.0" cy="132.0" r="4.2" fill="#FF4D6D" style="animation-delay:0.62s"/>
    <circle class="luz" cx="118.1" cy="129.9" r="4.2" fill="#4DABF7" style="animation-delay:0.99s"/>
    <circle class="luz" cx="138.2" cy="124.3" r="4.2" fill="#69DB7C" style="animation-delay:1.36s"/>
    <circle class="luz" cx="40.2" cy="158.1" r="4.2" fill="#FFA94D" style="animation-delay:0.13s"/>
    <circle class="luz" cx="62.5" cy="163.8" r="4.2" fill="#FFD43B" style="animation-delay:0.5s"/>
    <circle class="luz" cx="84.8" cy="166.6" r="4.2" fill="#FF4D6D" style="animation-delay:0.87s"/>
    <circle class="luz" cx="107.2" cy="166.6" r="4.2" fill="#4DABF7" style="animation-delay:1.24s"/>
    <circle class="luz" cx="129.5" cy="163.8" r="4.2" fill="#69DB7C" style="animation-delay:0.01s"/>
    <circle class="luz" cx="151.8" cy="158.1" r="4.2" fill="#FFA94D" style="animation-delay:0.38s"/>
    </g>
    <circle class="halo" cx="96" cy="30" r="22" fill="url(#brilho)"/>
    <path class="estrela" d="M96 12 L101.6 24.6 L115.3 25.8 L104.9 34.8 L108 48.2 L96 41.2 L84 48.2 L87.1 34.8 L76.7 25.8 L90.4 24.6 Z" fill="#FFD43B" stroke="#F59F00" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>
